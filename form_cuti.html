<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulir Pengajuan Cuti</title>
  
  <!-- Mencegah error favicon 404 -->
  <link rel="icon" href="data:,">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons untuk ikon tombol -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <style>
    body { background-color: #f8f9fa; padding-top: 20px; padding-bottom: 40px; }
    .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .section-title { font-weight: bold; background-color: #e9ecef; padding: 10px; border-radius: 5px; margin-top: 20px; margin-bottom: 15px; }
    #uploadSakitContainer { display: none; border: 2px dashed #dc3545; padding: 15px; border-radius: 5px; margin-bottom: 15px; }
    .rules-info { font-size: 0.85rem; color: #6c757d; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 form-container">
        <h3 class="text-center mb-4">FORMULIR PERMINTAAN DAN PEMBERIAN CUTI</h3>
        
        <form id="cutiForm" onsubmit="submitForm(event)">
          <!-- INPUT HIDDEN UNTUK MENYIMPAN ID / BARIS DATA SAAT MODE EDIT -->
          <input type="hidden" id="editId" name="editId" value="">

          <div class="section-title">I. DATA PEGAWAI</div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Nama Pegawai</label>
              <input class="form-control" list="listPegawai" name="nama" id="nama" placeholder="Memuat nama pegawai..." required onchange="pilihNamaPegawai(this.value)">
              <datalist id="listPegawai"></datalist>
            </div>
            <div class="col-md-6">
              <label class="form-label">NIP</label>
              <input type="text" class="form-control" name="nip" id="nip" required readonly style="background-color: #e9ecef;">
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-4">
              <label class="form-label">Jabatan</label>
              <input type="text" class="form-control" name="jabatan" id="jabatan" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Masa Kerja</label>
              <input type="text" class="form-control" name="masaKerja" id="masaKerja" placeholder="Contoh: 10 tahun 6 bulan" required>
              <div class="rules-info">*Tuliskan masa kerja secara lengkap</div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Unit Kerja</label>
              <input type="text" class="form-control" name="unitKerja" id="unitKerja" value="KPU KABUPATEN KARIMUN" required>
            </div>
          </div>

          <div class="section-title">II. JENIS CUTI YANG DIAMBIL</div>
          <div class="mb-3">
            <select class="form-select" name="jenisCuti" id="jenisCuti" onchange="toggleSakitUpload()" required>
              <option value="" disabled selected>-- Pilih Jenis Cuti --</option>
              <option value="Cuti Tahunan">Cuti Tahunan (Min. 1 Thn Kerja)</option>
              <option value="Cuti Besar">Cuti Besar (Min. 5 Thn Kerja)</option>
              <option value="Cuti Sakit">Cuti Sakit (Wajib Lampiran)</option>
              <option value="Cuti Melahirkan">Cuti Melahirkan</option>
              <option value="Cuti Karena Alasan Penting">Cuti Karena Alasan Penting</option>
              <option value="Cuti di Luar Tanggungan Negara">Cuti di Luar Tanggungan Negara (Min. 5 Thn Kerja)</option>
            </select>
          </div>

          <div id="uploadSakitContainer">
            <label class="form-label fw-bold text-danger">Upload Surat Keterangan Sakit (Wajib PDF)</label>
            <input type="file" class="form-control" id="fileSakit" accept=".pdf">
            <div class="rules-info text-muted" id="infoFileLama"></div>
          </div>

          <div class="section-title">III. ALASAN CUTI</div>
          <div class="mb-3">
            <textarea class="form-control" name="alasan" id="alasan" rows="2" placeholder="Sebutkan alasan detail..." required></textarea>
          </div>

          <div class="section-title">IV. LAMANYA CUTI</div>
          <div class="row mb-3">
            <div class="col-md-4">
              <label class="form-label">Lama Cuti (Hari)</label>
              <input type="number" class="form-control" name="lamaCuti" id="lamaCuti" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Mulai Tanggal</label>
              <input type="date" class="form-control" name="mulaiTanggal" id="mulaiTanggal" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">s/d Tanggal</label>
              <input type="date" class="form-control" name="sampaiTanggal" id="sampaiTanggal" required>
            </div>
          </div>

          <div class="section-title">V. ALAMAT SELAMA CUTI</div>
          <div class="mb-3">
            <textarea class="form-control" name="alamat" id="alamat" rows="2" required></textarea>
          </div>
          <div class="mb-4">
            <label class="form-label">Nomor Telepon / HP</label>
            <div class="input-group">
              <span class="input-group-text fw-bold">+62</span>
              <input type="tel" class="form-control" id="inputTelepon" name="telepon" placeholder="8123456789" required oninput="formatNomorHp(this)">
            </div>
            <div class="rules-info">*Masukkan nomor HP tanpa angka 0 di depan</div>
          </div>

          <div class="section-title">VI. PEJABAT PEMBERI PERSETUJUAN</div>
          <div class="row mb-4">
            <div class="col-md-6 border-end">
              <label class="form-label fw-bold text-primary">Atasan Langsung (Bagian VII)</label>
              <input type="text" class="form-control mb-2" name="jabatanAtasan" id="jabatanAtasan" placeholder="Jabatan Atasan Langsung" required>
              <input type="text" class="form-control mb-2" name="namaAtasan" id="namaAtasan" placeholder="Nama Atasan Langsung" required>
              <input type="text" class="form-control" name="nipAtasan" id="nipAtasan" placeholder="NIP Atasan Langsung" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold text-primary">Pejabat Berwenang (Bagian VIII)</label>
              <input type="text" class="form-control mb-2" name="jabatanPejabat" id="jabatanPejabat" placeholder="Jabatan Pejabat" required>
              <input type="text" class="form-control mb-2" name="namaPejabat" id="namaPejabat" placeholder="Nama Pejabat Berwenang" required>
              <input type="text" class="form-control" name="nipPejabat" id="nipPejabat" placeholder="NIP Pejabat Berwenang" required>
            </div>
          </div>

          <!-- BAGIAN TOMBOL AKSI -->
          <div class="d-grid gap-2">
            <!-- 1. Tombol Kirim Utama (Mode Tambah / Update) -->
            <button type="submit" class="btn btn-primary btn-lg" id="btnSubmit">
              <i class="bi bi-send-fill me-1"></i> Kirim Permintaan Cuti
            </button>
            
            <!-- 2. Tombol Edit Data Cuti -->
            <button type="button" class="btn btn-warning btn-lg fw-bold text-dark" id="btnEdit" onclick="editDataCuti()">
              <i class="bi bi-pencil-square me-1"></i> Edit Data Cuti
            </button>

            <!-- 3. Tombol Batal Edit (Awalnya tersembunyi) -->
            <button type="button" class="btn btn-danger btn-lg fw-bold" id="btnBatalEdit" style="display: none;" onclick="batalEdit()">
              <i class="bi bi-x-circle me-1"></i> Batal Edit
            </button>

            <hr class="my-2">

            <!-- 4. Tombol Cetak / Lihat -->
            <button type="button" class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#modalCari">
              <i class="bi bi-printer me-1"></i> Cetak / Lihat Surat Cuti (Input NIP)
            </button>
          </div>
        </form>
        
        <div id="statusMessage" class="mt-3 text-center fw-bold"></div>
      </div>
    </div>
  </div>

  <!-- Modal Pencarian Data Cuti -->
  <div class="modal fade" id="modalCari" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Cari Data Cuti Pegawai</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">NIP Anda</label>
            <input type="text" id="inputNipCari" class="form-control" placeholder="Masukkan NIP yang terdaftar" readonly style="background-color: #e9ecef;">
          </div>
          <div id="searchStatus" class="text-center small"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-primary" id="btnCari" onclick="cariDataOlehNip()">Cari & Cetak</button>
        </div>
      </div>
    </div>
  </div>

 <script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx9EsQQgRPA198A00P__gJfo3RX6iBo4olrHKPIlgp8TeTZtwG2YakDFvEjh9UKQTJweQ/exec";

  let dataPegawaiGlobal = [];

  window.addEventListener('DOMContentLoaded', () => {
    inialisasiSesiLogin();
    muatDaftarPegawai();
  });

  function inialisasiSesiLogin() {
    const loggedNip = sessionStorage.getItem('logged_nip') || localStorage.getItem('logged_nip');
    const loggedNama = sessionStorage.getItem('logged_nama') || localStorage.getItem('logged_nama');

    const inputNip = document.getElementById('nip');
    const inputNama = document.getElementById('nama');
    const inputNipCari = document.getElementById('inputNipCari');

    if (loggedNip) {
      if (inputNip) inputNip.value = loggedNip;
      if (inputNipCari) inputNipCari.value = loggedNip;
    }

    if (loggedNama && inputNama) {
      inputNama.value = loggedNama;
      inputNama.readOnly = true;
      inputNama.style.backgroundColor = '#e9ecef';
    }
  }

  function muatDaftarPegawai() {
    fetch(`${WEB_APP_URL}?action=getDaftarPegawai`, {
      method: 'GET',
      redirect: 'follow'
    })
    .then(response => response.json())
    .then(result => {
      if (result && result.success) {
        dataPegawaiGlobal = result.data;
        const datalist = document.getElementById('listPegawai');
        if (datalist) {
          datalist.innerHTML = '';
          dataPegawaiGlobal.forEach(pegawai => {
            const option = document.createElement('option');
            option.value = pegawai.nama;
            datalist.appendChild(option);
          });
        }

        const loggedNip = sessionStorage.getItem('logged_nip') || localStorage.getItem('logged_nip');
        const inputNama = document.getElementById('nama');
        if (loggedNip && inputNama && !inputNama.value) {
          const matched = dataPegawaiGlobal.find(p => String(p.nip).trim() === String(loggedNip).trim());
          if (matched) {
            inputNama.value = matched.nama;
            inputNama.readOnly = true;
            inputNama.style.backgroundColor = '#e9ecef';
          }
        }
      }
    })
    .catch(err => console.error("Gagal memuat daftar pegawai:", err));
  }

  function pilihNamaPegawai(namaPilihan) {
    const inputNip = document.getElementById('nip');
    const cleanNama = namaPilihan.trim().toLowerCase();

    if (!cleanNama) {
      if (inputNip) inputNip.value = '';
      return;
    }

    const ditemukan = dataPegawaiGlobal.find(p => p.nama.toLowerCase() === cleanNama);
    if (ditemukan) {
      if (inputNip) inputNip.value = ditemukan.nip;
    } else {
      if (inputNip) inputNip.value = '';
      if (namaPilihan.trim() !== "") {
        alert("Nama tidak ditemukan di database. Pastikan memilih dari daftar yang tersedia.");
      }
    }
  }

  function formatNomorHp(input) {
    let val = input.value.replace(/[^0-9]/g, '');
    if (val.startsWith('0')) val = val.substring(1);
    input.value = val;
  }

  function toggleSakitUpload() {
    const jenis = document.getElementById('jenisCuti').value;
    const container = document.getElementById('uploadSakitContainer');
    const fileInput = document.getElementById('fileSakit');
    
    if (container) container.style.display = (jenis === 'Cuti Sakit') ? 'block' : 'none';
    if (jenis !== 'Cuti Sakit' && fileInput) {
      fileInput.value = '';
      const infoLama = document.getElementById('infoFileLama');
      if (infoLama) infoLama.innerText = '';
    }
  }

  // ==========================================================
  // EDIT DATA CUTI (MENGAMBIL DATA & MEMASUKKAN KE FORM)
  // ==========================================================
  function editDataCuti() {
    const nipInput = document.getElementById('nip');
    const nip = nipInput ? nipInput.value.trim() : '';
    const status = document.getElementById('statusMessage');
    const btnEdit = document.getElementById('btnEdit');

    if (!nip) {
      alert("NIP tidak ditemukan. Silakan login kembali atau pastikan NIP terisi!");
      return;
    }

    if (btnEdit) btnEdit.disabled = true;
    if (status) {
      status.innerText = "Mencari data cuti untuk diedit...";
      status.style.color = "blue";
    }

    fetch(`${WEB_APP_URL}?action=cari&nip=${encodeURIComponent(nip)}`, {
      method: 'GET',
      redirect: 'follow'
    })
    .then(res => res.json())
    .then(result => {
      if (result && result.success && result.data) {
        tampilkanDataKeForm(result.data);
        if (status) {
          status.innerText = "Data berhasil dimuat! Silakan ubah formulir di atas lalu tekan 'Perbarui Data Cuti'.";
          status.style.color = "green";
        }
      } else {
        if (status) {
          status.innerText = result.message || "Data cuti tidak ditemukan untuk di-edit.";
          status.style.color = "red";
        }
      }
    })
    .catch(err => {
      console.error(err);
      if (status) {
        status.innerText = "Gagal mengambil data untuk di-edit. Periksa koneksi Anda.";
        status.style.color = "red";
      }
    })
    .finally(() => {
      if (btnEdit) btnEdit.disabled = false;
    });
  }

  function tampilkanDataKeForm(data) {
    // Simpan posisi baris (rowIndex) ke input hidden editId
    const editIdInput = document.getElementById('editId');
    if (editIdInput) editIdInput.value = data.rowIndex || data.rowId || data.id || '';

    if (data.nama) document.getElementById('nama').value = data.nama;
    if (data.nip) document.getElementById('nip').value = data.nip;
    if (data.jabatan) document.getElementById('jabatan').value = data.jabatan;
    if (data.masaKerja) document.getElementById('masaKerja').value = data.masaKerja;
    if (data.unitKerja) document.getElementById('unitKerja').value = data.unitKerja;
    if (data.jenisCuti) document.getElementById('jenisCuti').value = data.jenisCuti;
    if (data.alasan) document.getElementById('alasan').value = data.alasan;
    if (data.lamaCuti) document.getElementById('lamaCuti').value = data.lamaCuti;

    if (data.mulaiTanggal) document.getElementById('mulaiTanggal').value = formatTanggal(data.mulaiTanggal);
    if (data.sampaiTanggal) document.getElementById('sampaiTanggal').value = formatTanggal(data.sampaiTanggal);

    if (data.alamat) document.getElementById('alamat').value = data.alamat;
    
    if (data.telepon || data.inputTelepon) {
      let hp = String(data.telepon || data.inputTelepon).replace(/[^0-9]/g, '');
      if (hp.startsWith('62')) hp = hp.substring(2);
      if (hp.startsWith('0')) hp = hp.substring(1);
      const telpElem = document.getElementById('inputTelepon') || document.getElementById('telepon');
      if (telpElem) telpElem.value = hp;
    }

    if (data.jabatanAtasan) document.getElementById('jabatanAtasan').value = data.jabatanAtasan;
    if (data.namaAtasan) document.getElementById('namaAtasan').value = data.namaAtasan;
    if (data.nipAtasan) document.getElementById('nipAtasan').value = data.nipAtasan;

    if (data.jabatanPejabat) document.getElementById('jabatanPejabat').value = data.jabatanPejabat;
    if (data.namaPejabat) document.getElementById('namaPejabat').value = data.namaPejabat;
    if (data.nipPejabat) document.getElementById('nipPejabat').value = data.nipPejabat;

    toggleSakitUpload();

    if (data.fileSakitUrl) {
      const infoLama = document.getElementById('infoFileLama');
      if (infoLama) {
        infoLama.innerHTML = `*Berkas sebelumnya sudah diunggah. Biarkan kosong jika tidak ingin mengganti PDF.`;
      }
    }

    const btnSubmit = document.getElementById('btnSubmit');
    if (btnSubmit) {
      btnSubmit.innerHTML = `<i class="bi bi-save-fill me-1"></i> Perbarui Data Cuti`;
      btnSubmit.classList.remove('btn-primary');
      btnSubmit.classList.add('btn-success');
    }
    
    if (document.getElementById('btnEdit')) document.getElementById('btnEdit').style.display = 'none';
    if (document.getElementById('btnBatalEdit')) document.getElementById('btnBatalEdit').style.display = 'block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function formatTanggal(strDate) {
    if (!strDate) return '';
    const d = new Date(strDate);
    if (isNaN(d.getTime())) return strDate;
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function batalEdit() {
    const editId = document.getElementById('editId');
    const cutiForm = document.getElementById('cutiForm');
    if (editId) editId.value = '';
    if (cutiForm) cutiForm.reset();

    inialisasiSesiLogin();
    toggleSakitUpload();

    const btnSubmit = document.getElementById('btnSubmit');
    if (btnSubmit) {
      btnSubmit.innerHTML = `<i class="bi bi-send-fill me-1"></i> Kirim Permintaan Cuti`;
      btnSubmit.classList.remove('btn-success');
      btnSubmit.classList.add('btn-primary');
    }

    if (document.getElementById('btnEdit')) document.getElementById('btnEdit').style.display = 'block';
    if (document.getElementById('btnBatalEdit')) document.getElementById('btnBatalEdit').style.display = 'none';

    const status = document.getElementById('statusMessage');
    if (status) {
      status.innerText = "Mode edit dibatalkan.";
      status.style.color = "#6c757d";
    }
  }

  // ==========================================================
  // SUBMIT FORM (TAMBAH BARU / PERBARUI DATA)
  // ==========================================================
  function submitForm(event) {
    event.preventDefault();
    const form = document.getElementById('cutiForm');
    const btn = document.getElementById('btnSubmit');
    const status = document.getElementById('statusMessage');
    const jenisCuti = document.getElementById('jenisCuti').value;
    const fileInput = document.getElementById('fileSakit');
    const editIdVal = document.getElementById('editId') ? document.getElementById('editId').value : '';

    if (jenisCuti === 'Cuti Sakit' && !editIdVal && fileInput && fileInput.files.length === 0) {
      alert("Harap unggah Surat Keterangan Sakit (Format PDF) terlebih dahulu!");
      return;
    }

    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());
    
    // Tentukan aksi dan teruskan rowIndex jika mode edit
    if (editIdVal) {
      data.action = 'updateDataCuti';
      data.rowIndex = editIdVal;
    } else {
      data.action = 'simpanDataCuti';
    }

    btn.disabled = true;
    btn.innerText = editIdVal ? "Sedang Memperbarui Data..." : "Sedang Mengirim...";
    if (status) {
      status.innerText = "Mohon tunggu, sedang memproses data...";
      status.style.color = "blue";
    }

    if (fileInput && fileInput.files.length > 0) {
      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        data.fileSakitData = e.target.result.split(',')[1];
        data.fileSakitName = file.name;
        kirimKeServer(data);
      };
      reader.readAsDataURL(file);
    } else {
      kirimKeServer(data);
    }
  }

  function kirimKeServer(data) {
    const status = document.getElementById('statusMessage');
    const btn = document.getElementById('btnSubmit');

    fetch(WEB_APP_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8', 
      },
      body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(res => {
      if (res && (res.status === 'success' || res.success)) {
        if (status) status.innerHTML = `<span style="color:green">${res.message}</span>`;
        alert(res.message);
        batalEdit();
      } else {
        if (status) status.innerHTML = `<span style="color:red">Gagal: ${res.message || 'Terjadi kesalahan'}</span>`;
      }
    })
    .catch(error => {
      console.error('Error:', error);
      if (status) status.innerHTML = `<span style="color:red">Terjadi kesalahan koneksi/server.</span>`;
    })
    .finally(() => {
      if (btn) btn.disabled = false;
    });
  }

  function cariDataOlehNip() {
    const nipInput = document.getElementById('inputNipCari');
    const nip = nipInput ? nipInput.value.trim() : '';
    const status = document.getElementById('searchStatus');
    const btnCari = document.getElementById('btnCari');

    if (!nip) {
      alert("Silakan masukkan NIP terlebih dahulu!");
      return;
    }

    if (btnCari) btnCari.disabled = true;
    if (status) {
      status.innerText = "Sedang mencari data...";
      status.style.color = "blue";
    }

    const targetUrl = `${WEB_APP_URL}?action=cari&nip=${encodeURIComponent(nip)}`;

    fetch(targetUrl, {
      method: 'GET',
      redirect: 'follow'
    })
    .then(response => {
      if (!response.ok) throw new Error("Jaringan bermasalah atau CORS terblokir");
      return response.json();
    })
    .then(result => {
      if (result && result.success) {
        localStorage.setItem('previewCutiData', JSON.stringify(result.data));
        if (status) {
          status.innerText = "Data ditemukan! Membuka halaman preview...";
          status.style.color = "green";
        }
        window.location.href = `preview.html?nip=${encodeURIComponent(nip)}`;
      } else {
        if (status) {
          status.innerText = result.message || "NIP tidak ditemukan atau belum pernah mengajukan cuti.";
          status.style.color = "red";
        }
        if (btnCari) btnCari.disabled = false;
      }
    })
    .catch(err => {
      console.error(err);
      if (status) {
        status.innerText = "Gagal mengambil data. Pastikan file diakses via web server/GitHub Pages.";
        status.style.color = "red";
      }
      if (btnCari) btnCari.disabled = false;
    });
  }
</script>
</body>
</html>
